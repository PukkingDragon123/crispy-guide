<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Double Life 🍦🦷</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍦</text></svg>">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #241c2e;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: none;
    background: #241c2e;
  }
  #foot {
    position: fixed; bottom: 6px; width: 100%;
    text-align: center; color: #5d4b70;
    font: 11px monospace; pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>
<div id="foot">DOUBLE LIFE · scoop by day, drill by night</div>
<script src="js/util.js"></script>
<script src="js/font.js"></script>
<script src="js/audio.js"></script>
<script src="js/state.js"></script>
<script src="js/sprites.js"></script>
<script src="js/day.js"></script>
<script src="js/night.js"></script>
<script src="js/shop.js"></script>
<script src="js/main.js"></script>
</body>
</html>
